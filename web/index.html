<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BMS-IR Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>BMS-IR Arena</h1>
    <div class="header-actions">
      <button id="settings-open" class="quiet icon-button" type="button" data-i18n-aria-label="settingsOpen" aria-label="設定" title="設定">
        <span aria-hidden="true">&#9881;</span>
      </button>
      <button id="language" class="quiet language-button" type="button" aria-label="英語に切り替え" title="英語に切り替え">
        <span class="language-icon" aria-hidden="true">&#127760;</span>
        <span id="language-label">日本語</span>
      </button>
    </div>
  </header>

  <section id="settings-view" class="settings-view" hidden>
    <button id="settings-back" class="quiet icon-button" type="button" data-i18n-aria-label="settingsBack" aria-label="戻る" title="戻る">
      <span aria-hidden="true">&#8592;</span>
    </button>
    <h2 data-i18n="settingsTitle">設定</h2>
    <div class="settings-list">
      <label class="settings-row">
        <div>
          <p class="settings-row-title" data-i18n="settingsResident">常駐(トレイ)を有効にする</p>
          <p class="settings-row-hint" data-i18n="settingsResidentHint">閉じてもトレイに残り続けます</p>
        </div>
        <input id="setting-resident" type="checkbox">
      </label>
      <label class="settings-row" id="settings-row-autostart">
        <div>
          <p class="settings-row-title" data-i18n="settingsAutostart">ログイン時に自動起動</p>
          <p class="settings-row-hint" data-i18n="settingsAutostartHint">常駐が必要です</p>
        </div>
        <input id="setting-autostart" type="checkbox">
      </label>
      <label class="settings-row">
        <div>
          <p class="settings-row-title" data-i18n="settingsBackgroundCheck">バックグラウンド自動チェック</p>
          <p class="settings-row-hint" data-i18n="settingsBackgroundCheckHint">1日1回、自動で更新を確認し、見つかったら通知します</p>
        </div>
        <input id="setting-background-check" type="checkbox">
      </label>
    </div>
  </section>

  <div id="main-view">
  <section class="status-cards" aria-live="polite">
    <div class="status-card">
      <div>
        <p class="status-card-label" data-i18n="statusBody">本体</p>
        <p id="body-version-line" class="status-card-version">…</p>
      </div>
      <span id="body-badge" class="status-badge" data-kind="neutral"></span>
    </div>
    <div class="status-card">
      <div>
        <p class="status-card-label" data-i18n="statusLauncher">ランチャー</p>
        <p id="launcher-version-line" class="status-card-version">…</p>
      </div>
      <span id="launcher-badge" class="status-badge" data-kind="neutral"></span>
    </div>
  </section>

  <section class="status-band" aria-live="polite">
    <span id="status-mark" aria-hidden="true"></span>
    <div>
      <strong id="update-status" data-i18n="checking">更新を確認しています</strong>
      <p id="installation-status"></p>
      <div id="update-progress" class="update-progress" hidden>
        <div class="progress-heading">
          <span id="progress-label"></span>
          <strong id="progress-percent">0%</strong>
        </div>
        <progress id="progress-bar" max="100" value="0">0%</progress>
        <p id="progress-detail"></p>
      </div>
    </div>
  </section>

  <section class="actions" aria-label="Launch actions">
    <button id="play" class="primary" type="button" disabled data-i18n="play">Arenaを起動</button>
    <button id="configure" type="button" disabled data-i18n="configure">起動前コンフィグ</button>
    <button id="check" class="quiet" type="button" data-i18n="check">更新を確認</button>
  </section>

  <section class="information" aria-labelledby="information-title">
    <h2 id="information-title" data-i18n="information">お知らせ</h2>
    <ul id="announcements" aria-live="polite">
      <li class="empty-information" data-i18n="noInformation">現在のお知らせはありません</li>
    </ul>
  </section>

  <section id="update-panel" class="update-panel" hidden>
    <h2 id="available-title"></h2>
    <p id="available-published-at" class="published-at"></p>
    <p id="available-size" class="published-at"></p>
    <details id="release-notes-details">
      <summary data-i18n="releaseNotesToggle">リリースノートを見る</summary>
      <div id="release-notes" class="notes"></div>
    </details>
    <div class="actions">
      <button id="update-launch" class="primary" type="button" data-i18n="updateLaunch">更新して起動</button>
      <button id="update-only" type="button" data-i18n="updateOnly">更新のみ</button>
      <button id="launch-current" type="button" data-i18n="launchCurrent">現在の版を起動</button>
    </div>
  </section>

  <section class="deprecated-panel">
    <button id="deprecated-toggle" class="quiet" type="button" data-i18n="deprecatedToggle" aria-expanded="false" aria-controls="deprecated-list-container">非推奨版から選択</button>
    <div id="deprecated-list-container" hidden>
      <p id="deprecated-loading" class="empty-information" hidden data-i18n="deprecatedLoading">読み込んでいます…</p>
      <p id="deprecated-empty" class="empty-information" hidden data-i18n="deprecatedEmpty">非推奨版はありません</p>
      <ul id="deprecated-list" aria-live="polite"></ul>
      <p class="deprecated-more">
        <a id="deprecated-more-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="deprecatedMoreLink">もっと古い版はこちら</a>
      </p>
    </div>
  </section>

  <details id="details" hidden>
    <summary data-i18n="details">詳細</summary>
    <pre id="error-detail"></pre>
  </details>
  </div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
