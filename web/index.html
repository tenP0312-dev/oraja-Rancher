<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BMS-IR Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>BMS-IR Arena</h1>
      <p id="version">...</p>
      <p id="launcher-version">Launcher ...</p>
    </div>
    <button id="language" class="quiet language-button" type="button" aria-label="英語に切り替え" title="英語に切り替え">
      <span class="language-icon" aria-hidden="true">&#127760;</span>
      <span id="language-label">日本語</span>
    </button>
  </header>

  <section class="status-band" aria-live="polite">
    <span id="status-mark" aria-hidden="true"></span>
    <div>
      <strong id="update-status" data-i18n="checking">更新を確認しています</strong>
      <p id="installation-status"></p>
      <div id="update-progress" class="update-progress" hidden>
        <div class="progress-heading">
          <span id="progress-label"></span>
          <strong id="progress-percent">0%</strong>
        </div>
        <progress id="progress-bar" max="100" value="0">0%</progress>
        <p id="progress-detail"></p>
      </div>
    </div>
  </section>

  <section class="actions" aria-label="Launch actions">
    <button id="play" class="primary" type="button" disabled data-i18n="play">Arenaを起動</button>
    <button id="configure" type="button" disabled data-i18n="configure">起動前コンフィグ</button>
    <button id="check" class="quiet" type="button" data-i18n="check">更新を確認</button>
  </section>

  <section class="information" aria-labelledby="information-title">
    <h2 id="information-title" data-i18n="information">お知らせ</h2>
    <ul id="announcements" aria-live="polite">
      <li class="empty-information" data-i18n="noInformation">現在のお知らせはありません</li>
    </ul>
  </section>

  <section id="update-panel" class="update-panel" hidden>
    <h2 id="available-title"></h2>
    <div id="release-notes" class="notes"></div>
    <div class="actions">
      <button id="update-launch" class="primary" type="button" data-i18n="updateLaunch">更新して起動</button>
      <button id="launch-current" type="button" data-i18n="launchCurrent">現在の版を起動</button>
    </div>
  </section>

  <details id="details" hidden>
    <summary data-i18n="details">詳細</summary>
    <pre id="error-detail"></pre>
  </details>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
