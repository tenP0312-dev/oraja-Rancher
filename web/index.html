<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BMS-IR Arena Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">BMS-IR</p>
      <h1 data-i18n="title">Arena Launcher</h1>
      <p class="lead" data-i18n="lead">署名を検証して、安全に更新・設定・起動します。</p>
    </div>
    <button id="language" type="button" aria-label="Switch language">EN</button>
  </header>

  <section aria-labelledby="install-heading">
    <h2 id="install-heading" data-i18n="installation">本体</h2>
    <label for="root" data-i18n="rootLabel">BMS-IR Arena oraja フォルダ</label>
    <div class="row">
      <input id="root" autocomplete="off" placeholder="/path/to/BMS-IR Arena oraja">
      <button id="browse-root" class="secondary" type="button" data-i18n="browse">参照</button>
      <button id="inspect" type="button" data-i18n="inspect">確認</button>
    </div>
    <label for="java" data-i18n="javaLabel">Java 17（自動検出できない場合）</label>
    <div class="row">
      <input id="java" autocomplete="off" placeholder="/path/to/java">
      <button id="browse-java" class="secondary" type="button" data-i18n="browse">参照</button>
      <button id="use-java" type="button" data-i18n="useJava">使用</button>
    </div>
    <div id="installation-status" class="status" role="status"></div>
  </section>

  <section aria-labelledby="actions-heading">
    <h2 id="actions-heading" data-i18n="actions">起動</h2>
    <div class="actions">
      <button id="configure" class="secondary" type="button" disabled data-i18n="configure">設定を開く</button>
      <button id="play" class="primary" type="button" disabled data-i18n="play">ゲームを起動</button>
    </div>
    <p class="hint" data-i18n="javaHint">同梱Java 17を優先し、見つからない場合は指定されたJavaを使用します。</p>
  </section>

  <section aria-labelledby="update-heading">
    <h2 id="update-heading" data-i18n="update">更新</h2>
    <p data-i18n="updateText">更新はEd25519署名と全ファイルのSHA-256が一致した場合だけ適用されます。失敗時はバックアップから復元します。</p>
    <label for="staging" data-i18n="stagingLabel">検証済み更新ファイルのフォルダ</label>
    <div class="row">
      <input id="staging" autocomplete="off">
      <button id="browse-staging" class="secondary" type="button" data-i18n="browse">参照</button>
    </div>
    <label for="manifest" data-i18n="manifestLabel">署名済みmanifest.json</label>
    <div class="row">
      <input id="manifest" autocomplete="off">
      <button id="browse-manifest" class="secondary" type="button" data-i18n="browse">参照</button>
      <button id="inspect-update" class="secondary" type="button" disabled data-i18n="inspectUpdate">内容を確認</button>
      <button id="apply-update" type="button" disabled data-i18n="applyUpdate">検証して適用</button>
      <button id="self-update" class="secondary" type="button" disabled data-i18n="selfUpdate">ランチャーを更新</button>
    </div>
    <div id="release-notes" class="notes" aria-live="polite"></div>
    <pre id="update-status" class="status" role="status"></pre>
    <p class="warning" data-i18n="signing">正式配布版はWindows AuthenticodeとmacOS Developer ID公証済みである必要があります。</p>
  </section>

  <section aria-labelledby="ini-heading">
    <h2 id="ini-heading" data-i18n="ini">INI設定</h2>
    <p class="hint" data-i18n="iniHint">未知の項目・コメント・順序を保ったまま、指定した項目だけ更新します。</p>
    <div class="row">
      <input id="ini-path" autocomplete="off" aria-label="INI path">
      <button id="browse-ini" class="secondary" type="button" data-i18n="browse">参照</button>
    </div>
    <div class="row">
      <input id="ini-key" autocomplete="off" data-i18n-placeholder="iniKey" placeholder="SECTION.key">
      <input id="ini-value" autocomplete="off" data-i18n-placeholder="iniValue" placeholder="value">
      <button id="save-ini" type="button" data-i18n="save">保存</button>
    </div>
    <div id="ini-status" class="status" role="status"></div>
  </section>
</main>
<script src="main.js"></script>
</body>
</html>
